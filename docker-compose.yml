# Local edge stack for temporal-classifier.
# Network path: subscribe to camera-connector FrameService and publish
# refined SceneResult to core ingest (IngestScene).
#
# Usage (network-path against a live FrameService):
#   FRAME_GRPC_ADDR=host.docker.internal:50060 \
#   INGEST_ADDR=host.docker.internal:50052 \
#   docker compose up --build
#
# Usage (standalone file demo):
#   SOURCE=./data/sample.mp4 MODEL=./models/movinet_a0.onnx \
#   docker compose run --rm temporal-classifier \
#     --source /data/sample.mp4 /models/movinet_a0.onnx

services:
  temporal-classifier:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      INGEST_ADDR: ${INGEST_ADDR:-host.docker.internal:50052}
      FRAME_GRPC_ADDR: ${FRAME_GRPC_ADDR:-host.docker.internal:50060}
      FRAME_ENCODING: ${FRAME_ENCODING:-jpeg}
      FRAME_CAMERA_ID: ${FRAME_CAMERA_ID:-}
      ORT_DEVICE: ${ORT_DEVICE:-cpu}
      MOVINET_MODEL: ${MOVINET_MODEL:-/app/models/movinet_a0.onnx}
      CLIP_FRAMES: ${CLIP_FRAMES:-16}
      CLIP_FPS: ${CLIP_FPS:-5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      - ${MODEL_DIR:-./models}:/app/models:ro
      - ${DATA_DIR:-./data}:/data:ro
    # Default: network-path (camera-connector FrameService → IngestScene)
    command:
      - "--network-path"
      - "${FRAME_GRPC_ADDR:-host.docker.internal:50060}"
      - "${MOVINET_MODEL:-/app/models/movinet_a0.onnx}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
