# Map MoViNet (or heuristic) outputs → AgentJetson Level-2 labels.
# Level-2 ids MUST exist in config/taxonomy.yaml
# (copy of contract/domain/taxonomy.yaml).

version: "1"

# All L2 ids from the contract taxonomy (roadway + sidewalk + facility + unknown).
level2_targets:
  # roadway
  - driving
  - stopped
  - traffic_stop
  - congestion
  - crash
  # sidewalk
  - walking
  - gathering
  # facility
  - entry
  - queue
  # unknown
  - abstain

# Optional model-label → taxonomy L2 aliases (fill once Kinetics/MoViNet labels known):
# model_aliases:
#   "driving car": driving
#   "waiting in line": stopped
#   "getting out of car": traffic_stop
