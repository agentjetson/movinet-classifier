syntax = "proto3";

package common.v1;

option cc_enable_arenas = true;
option go_package = "github.com/agentjetson/contract/gen/go/common/v1;commonv1";

// Domain-level error returned inside responses
// (not transport-level grpc status)
message DomainError {
  string code = 1;
  string message = 2;
}
